<!doctype html>
<html lang="en" data-theme="midnight" data-style="clay" data-base="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0d17">
  <title>LearnMotion — interactive, animated, interview-ready</title>
  <meta name="description" content="Learn by seeing it, trying it, and building it. Explore 50+ lessons per subject, interactive labs, games and puzzles across technology, music and design.">
  <meta name="application-name" content="LearnMotion">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LearnMotion">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='img/pwa-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="canonical" href="{{ public_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LearnMotion">
  <meta property="og:title" content="LearnMotion — Learn by doing">
  <meta property="og:description" content="Explore interactive lessons, hands-on labs, games and puzzles across technology, music and design.">
  <meta property="og:url" content="{{ public_url }}">
  <meta property="og:image" content="{{ public_url }}{{ url_for('static', filename='img/learnmotion-share.png') }}">
  <meta property="og:image:secure_url" content="{{ public_url }}{{ url_for('static', filename='img/learnmotion-share.png') }}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="LearnMotion: interactive lessons, hands-on labs, games and puzzles.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LearnMotion — Learn by doing">
  <meta name="twitter:description" content="Explore interactive lessons, hands-on labs, games and puzzles across technology, music and design.">
  <meta name="twitter:image" content="{{ public_url }}{{ url_for('static', filename='img/learnmotion-share.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/clay.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/subjects.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cicd.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dsa.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/qa.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ds.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ml.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/account.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" id="brand" href="#/">
      <span class="brand-logo clay" id="brandLogo"></span>
      <span id="brandName"><b>Learn</b>Motion</span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="topbar-right">
      <button type="button" class="gs-open clay" id="gsOpen" title="Search all topics" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <span class="gs-label">Search topics</span><kbd id="gsKbd">⌘K</kbd>
      </button>
      <button type="button" class="chat-open clay" id="chatOpen" title="Ask the AI tutor" aria-haspopup="dialog" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
        <span>Ask AI</span>
      </button>
      <button type="button" class="btn small pwa-install" id="pwaInstall" title="Install LearnMotion" hidden>Install</button>
      <div class="progress-chip clay" id="progressChip" title="Topics marked as learned">0 / 0 learned</div>
      <div class="acct" id="acct"></div>
      <div class="theme-wrap">
        <button type="button" class="btn theme-btn" id="themeBtn" title="Theme" aria-haspopup="true" aria-expanded="false"><span class="swatch-dot"></span></button>
        <div class="theme-pop clay" id="themePop" hidden></div>
      </div>
    </div>
  </header>

  <div class="gs-backdrop" id="gsDialog" hidden>
    <div class="gs-panel clay" role="dialog" aria-modal="true" aria-label="Search all topics">
      <div class="gs-field">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="gsInput" type="search" placeholder="Search any topic: HPA, joins, rebase, decorators, IAM, chmod, records…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="gsList">
        <button type="button" class="btn small" id="gsClose">Esc</button>
      </div>
      <label class="gs-smart-toggle" for="gsSmart">
        <input id="gsSmart" type="checkbox">
        <span class="gs-switch" aria-hidden="true"></span>
        <span class="gs-smart-copy"><b>Smart Search</b><small>Understands plain English, related terms and typos · runs locally</small></span>
      </label>
      <p class="gs-hint muted" id="gsHint"></p>
      <ul class="gs-list clean" id="gsList" role="listbox"></ul>
      <div class="gs-foot muted"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open topic</span><span><kbd>Esc</kbd> close</span></div>
    </div>
  </div>

  <main id="view" class="view"><div class="loading clay">Loading…</div></main>

  <div id="toast" class="toast clay" hidden></div>

  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/pwa.js') }}"></script>
</body>
</html>
